[tool.poetry]
name = "noema"
version = "0.14.0"
description = "Noema: local-first Personal Behavioral Intelligence (observed vs intended activity)."
authors = ["Noema contributors"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://github.com/Nithin031/Noema"
repository = "https://github.com/Nithin031/Noema"
documentation = "https://github.com/Nithin031/Noema/tree/main/src/noema/docs"
keywords = ["behavioral-intelligence", "local-first", "privacy", "productivity", "intent-alignment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
packages = [{include = "noema", from = "src"}]

[tool.poetry.scripts]
noema = "noema.cli.daemon:main"

[tool.poetry.dependencies]
python = "^3.9"
google-genai = "*"

[tool.poetry.group.dev.dependencies]
mypy = "*"
pytest = "*"
pytest-cov = "*"
pytest-benchmark = "*"
psutil = "*"
pywin32-ctypes = {version = "*", platform = "win32"}
pefile = {version = "*", platform = "win32"}

pyinstaller = {version = "*", python = "^3.9,<3.14"}
# releases are very infrequent, so good idea to use the master branch
# we need this unreleased commit: https://github.com/pyinstaller/pyinstaller-hooks-contrib/commit/0f40dc6e74086e5472aee75070b9077b4c17ab18
pyinstaller-hooks-contrib = {git = "https://github.com/pyinstaller/pyinstaller-hooks-contrib.git", branch="master"}

# PyInstaller still imports pkg_resources, which setuptools removed in 81+.
setuptools = ">=78.1.1,<81"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
