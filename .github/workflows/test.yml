name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no hosted keys, no ActivityWatch, no Ollama)
        run: |
          python -m pip install --upgrade pip
          pip install . --no-deps
          pip install pytest pytest-cov
      - name: Run test suite (mocks only)
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: Compile check
        run: python -m compileall src/noema -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
