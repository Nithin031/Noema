name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the package with its declared runtime dependency
      # (google-genai). No API key is needed: the provider SDK is only
      # imported, and every provider call in the suite is mocked. Running
      # without hosted keys, ActivityWatch, or Ollama is intentional.
      - name: Install (declared deps; no hosted keys, no ActivityWatch, no Ollama)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov
      - name: Run test suite (mocks only)
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: Compile check
        run: python -m compileall src/noema -q
